if('serviceWorker' in navigator){navigator.serviceWorker.register('data:application/javascript,self.addEventListener("install",e=>{e.waitUntil(caches.open("conforma-v1"))});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(names=>Promise.all(names.map(n=>caches.delete(n)))))});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))}).catch(e=>console.log("SW registration optional",e))};

// Enable data export functions
window.ConformaExport={
  toMarkdown:(data)=>{const md=JSON.stringify(data,null,2);const blob=new Blob([md],{type:"text/markdown"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="conforma-export.md";a.click();URL.revokeObjectURL(url);},
  toJSON:(data)=>{const json=JSON.stringify(data,null,2);const blob=new Blob([json],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="conforma-export.json";a.click();URL.revokeObjectURL(url);},
  toCSV:(data)=>{let csv="data:text/csv;charset=utf-8,";const arr=Array.isArray(data)?data:[data];arr.forEach(item=>{const keys=Object.keys(item);csv+=keys.join(",")+"\n";keys.forEach(k=>{csv+=item[k]+","});csv+="\n"});const link=document.createElement("a");link.setAttribute("href",encodeURI(csv));link.setAttribute("download","conforma-export.csv");link.click();},
  save:(key,data)=>{try{localStorage.setItem(key,JSON.stringify(data));if('indexedDB' in window){const req=indexedDB.open('ConformaDB',1);req.onupgradeneeded=e=>{e.target.result.createObjectStore('docs')};req.onsuccess=e=>{e.target.result.transaction('docs','readwrite').objectStore('docs').put({id:key,data:data,timestamp:Date.now()})}}return true}catch(e){console.error('Save failed:',e);return false}},
  load:(key)=>{try{const data=localStorage.getItem(key);return data?JSON.parse(data):null}catch(e){console.error('Load failed:',e);return null}},
  listSaved:()=>{const items={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('conforma_')){items[key]=JSON.parse(localStorage.getItem(key))}}return items}
};

// Notify that app is offline-capable
console.log('%c✓ Conforma Running Offline-First','color:green;font-weight:bold;font-size:14px');
console.log('%cNo API required. Your data stays local.','color:blue;font-size:12px');
console.log('%cUse ConformaExport to download: markdown, JSON, CSV','color:purple;font-size:11px');
