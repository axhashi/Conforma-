| A.5.33 | Protection of records | Applicable | Records protected against loss and tampering; retained |
| A.5.34 | Privacy and protection of PII | Applicable | PII handled per privacy obligations and data protection law |
| A.5.35 | Independent review of information security | Applicable | Independent review / internal audit at planned intervals |
| A.5.36 | Compliance with policies, rules and standards | Applicable | Compliance checks against policies and standards |
| A.5.37 | Documented operating procedures | Applicable | Operating procedures documented and available |

### Theme 6 People

| Control | Title | Applicability | Implementation |
|---|---|---|---|
| A.6.1 | Screening | Applicable | Background screening prior to access, per contract |
| A.6.2 | Terms and conditions of employment | Applicable | Security responsibilities stated in employment terms |

### Theme 7 Physical

| A.7.6 | Working in secure areas | Applicable | Rules for working in secure areas |

### Theme 8 Technological

| A.8.32 | Change management | Applicable | Change-management process with approval and testing |
| A.8.33 | Test information | Applicable | Test data protected; no production CUI in test |
| A.8.34 | Protection of systems during audit testing | Applicable | Audit tests planned to minimise disruption |

_This is a representative control set; the full SoA covers all Annex A:2022 controls. Applicability is confirmed by the risk assessment and treatment plan._`},sec_access:{title:"Access Control \u2014 Control Pack",clause:"A.5.15\u20135.18, A.8.2\u20138.5",content:`# Access Control
_ISO/IEC 27001:2022 \u2014 A.5.15\u20135.18, A.8.2\u20138.5 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to grant, review and revoke access on least-privilege and need-to-know principles, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Provision access via role-based access control (RBAC) on joiner.
2. Require MFA for remote and privileged access.
3. Enforce least privilege; separate duties for sensitive functions.
4. Review access rights at least quarterly and on role change.
5. Revoke access immediately on leaver or role removal.
6. Log and monitor privileged access.

## Key Controls
| Control | Standard |
|---|---|
| Least privilege / RBAC | Roles mapped to job function |
| MFA | Remote + privileged access |
| Access review | Quarterly + on change |
| Joiner/mover/leaver | Tied to HR process |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Access requests, quarterly access reviews, and privileged-access logs. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_crypto:{title:"Cryptography & Key Management \u2014 Control Pack",clause:"A.8.24",content:`# Cryptography & Key Management
_ISO/IEC 27001:2022 \u2014 A.8.24 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to protect information in transit and at rest with appropriate cryptography and managed keys, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Encrypt data in transit (TLS 1.2+) and at rest (AES-256).
2. Define approved algorithms and key lengths.
3. Manage keys through their lifecycle: generate, store, rotate, revoke.
4. Protect keys with access control and, where required, an HSM/KMS.
5. Rotate keys on schedule and on compromise.
6. Record cryptographic controls in the asset register.

## Key Controls
| Control | Standard |
|---|---|
| In transit | TLS 1.2+ |
| At rest | AES-256 |
| Key storage | KMS/HSM, access-controlled |
| Rotation | Scheduled + on compromise |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
The cryptographic controls register and key-rotation logs. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_incident:{title:"Information Security Incident Management \u2014 Control Pack",clause:"A.5.24\u20135.28",content:`# Information Security Incident Management
_ISO/IEC 27001:2022 \u2014 A.5.24\u20135.28 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to detect, respond to, and learn from information security incidents and breaches, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Provide a channel to report security events.
2. Triage and classify events; declare incidents by severity.
3. Contain, eradicate and recover per the response plan.
4. Notify the customer and regulators within contractual/legal timeframes.
5. Preserve evidence and conduct post-incident review.
6. Feed lessons into risk and control improvements.

## Key Controls
| Control | Standard |
|---|---|
| Reporting channel | Available to all staff |
| Severity classification | Defined matrix |
| Breach notification | Per contract/law timeframes |
| Post-incident review | For all major incidents |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Security incident records, breach notifications, and post-incident reviews. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_supplier:{title:"Supplier & Cloud Security \u2014 Control Pack",clause:"A.5.19\u20135.23",content:`# Supplier & Cloud Security
_ISO/IEC 27001:2022 \u2014 A.5.19\u20135.23 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to ensure suppliers and cloud services meet the organization's security requirements, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Assess supplier/cloud security before engagement.
2. Include security requirements and right-to-audit in contracts.
3. Review provider assurance (e.g. SOC 2, ISO 27001, FedRAMP).
4. Monitor supplier security performance.
5. Manage changes and offboarding securely.
6. Maintain a register of suppliers and their assurance status.

## Key Controls
| Control | Standard |
|---|---|
| Pre-engagement assessment | Required |
| Contract security clauses | Standard |
| Provider assurance | Reviewed periodically |
| Offboarding | Access and data removal |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
The supplier security register and assurance reviews. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_logging:{title:"Logging & Monitoring \u2014 Control Pack",clause:"A.8.15\u20138.16",content:`# Logging & Monitoring
_ISO/IEC 27001:2022 \u2014 A.8.15\u20138.16 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to record security-relevant events and detect anomalies in a timely way, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Log authentication, access, and administrative events centrally.
2. Protect logs from tampering; retain per policy.
3. Define alerting rules for anomalies and threats.
4. Review alerts and investigate as needed.
5. Correlate events for detection (SIEM where available).
6. Report monitoring outcomes to management.

## Key Controls
| Control | Standard |
|---|---|
| Central logging | Security-relevant events |
| Log protection | Tamper-resistant, retained |
| Alerting | Anomaly + threat rules |
| Review | Defined cadence |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Log configuration, alert definitions, and monitoring reports. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_vuln:{title:"Vulnerability & Patch Management \u2014 Control Pack",clause:"A.8.8",content:`# Vulnerability & Patch Management
_ISO/IEC 27001:2022 \u2014 A.8.8 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to identify and remediate technical vulnerabilities before they can be exploited, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Scan systems for vulnerabilities on a schedule.
2. Rate findings by severity (e.g. CVSS).
3. Remediate within severity-based SLAs.
4. Patch systems on a defined cadence and for emergencies.
5. Verify remediation and track exceptions.
6. Report vulnerability posture to management.

## Key Controls
| Control | Standard |
|---|---|
| Scanning | Scheduled |
| Severity SLAs | Critical fastest |
| Patch cadence | Routine + emergency |
| Exceptions | Tracked with risk acceptance |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Scan results, remediation tracking, and patch records. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_continuity:{title:"Business Continuity & Backup \u2014 Control Pack",clause:"A.5.29\u20135.30, A.8.13\u20138.14",content:`# Business Continuity & Backup
_ISO/IEC 27001:2022 \u2014 A.5.29\u20135.30, A.8.13\u20138.14 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to maintain and recover information security during and after disruption, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Identify critical services and set RTO/RPO.
2. Back up data on schedule and protect backups.
3. Document continuity and recovery plans.
4. Test recovery from backup at least annually.
5. Include security requirements in continuity plans.
6. Review and update after tests and major change.

## Key Controls
| Control | Standard |
|---|---|
| Backup schedule | Defined; protected copies |
| Restore testing | At least annual |
| RTO/RPO | Agreed with customer |
| Plan review | Post-test + on change |

## Roles & Responsibilities
- **Continuity Manager** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Backup logs, restore-test results, and continuity plans. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},sec_hr:{title:"Human Resource Security \u2014 Control Pack",clause:"A.6.1\u20136.8",content:`# Human Resource Security
_ISO/IEC 27001:2022 \u2014 A.6.1\u20136.8 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to ensure personnel are suitable for, aware of, and accountable to their security responsibilities, in support of securely delivering the Enterprise IT Service Desk (EITSD) contract and maintaining ISO/IEC 27001 certification.

## Procedure
1. Screen personnel before granting access, per contract.
2. State security responsibilities in employment terms.
3. Deliver security awareness training at onboarding and annually.
4. Apply the disciplinary process for violations.
5. Manage secure remote working.
6. Remove access and return assets on exit.

## Key Controls
| Control | Standard |
|---|---|
| Screening | Pre-access |
| Awareness | Onboarding + annual |
| Disciplinary | Documented |
| Leaver process | Access + asset return |

## Roles & Responsibilities
- **HR + Security Lead** \u2014 owns this control area and its effectiveness.
- **Asset/System Owners** \u2014 implement controls for their systems.
- **All personnel** \u2014 comply and report security events.

## Required Records
Screening records, training records, and leaver checklists. Records are retained per the Documented Information Control procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`}},audit:{4:{"Audit Checklist":`## ISMS Internal Audit Checklist \u2014 Clause 4 (Context of the organization)

_CMMC Level 2 / NIST SP 800-171 \xB7 Meridian Federal Solutions_

## Purpose
Meridian Federal Solutions, LLC protects Controlled Unclassified Information (CUI) handled in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce, meeting NIST SP 800-171 and CMMC Level 2 requirements.

## Policy statements
- We identify and mark CUI and limit access to authorized personnel.
- We implement all 110 NIST SP 800-171 requirements across the 14 families.
- We use FIPS-validated cryptography to protect CUI in transit and at rest.
- We detect, report and respond to incidents involving CUI.
- We assess controls, maintain an SSP and POA&M, and pursue CMMC certification.

## Approval
Issued by top management; reviewed at least annually.`},roles:{title:"Roles & Responsibilities",clause:"3.1 / 3.9",content:`# Roles & Responsibilities

_NIST SP 800-171 \xB7 3.1 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to limit system access to authorized users and processes, on least privilege, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Access Control controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.1.1 | Limit system access to authorized users, processes, and devices | Access is limited to authorized users, processes, and devices through Microsoft Entra ID with role-based access control (RBAC); accounts are provisioned via an approval workflow. |
| 3.1.2 | Limit access to permitted transactions and functions | Users are restricted to permitted transactions and functions via RBAC roles scoped to job duties in Microsoft Entra ID and ServiceNow. |
| 3.1.3 | Control the flow of CUI per approved authorizations | CUI flow is controlled by network segmentation, DLP policy, and approved connection rules documented in the boundary diagram. |
| 3.1.4 | Separate duties to reduce risk of malevolent activity | Separation of duties is enforced so request, approval, and administration of access are performed by different roles. |
| 3.1.5 | Employ least privilege, including for privileged accounts | Least privilege is enforced; privileged access is limited to named administrators and reviewed quarterly. |
| 3.1.6 | Use non-privileged accounts for nonsecurity functions | Administrators use separate non-privileged accounts for routine, non-security functions. |
| 3.1.7 | Prevent non-privileged users from executing privileged functions; log them | Non-privileged users are prevented from executing privileged functions; such attempts are captured in Microsoft Sentinel (SIEM). |
| 3.1.8 | Limit unsuccessful logon attempts | Accounts lock after 5 failed logon attempts for a defined lockout period. |
| 3.1.9 | Provide privacy and security notices consistent with CUI rules | A system-use / privacy banner consistent with CUI rules is displayed at logon. |
| 3.1.10 | Use session lock with pattern-hiding displays after inactivity | Session lock with a pattern-hiding display engages after 15 minutes of inactivity, enforced via Microsoft Intune. |
| 3.1.11 | Terminate a user session after a defined condition | User sessions terminate automatically after 30 minutes of inactivity or at defined conditions. |
| 3.1.12 | Monitor and control remote access sessions | Remote access sessions are monitored and controlled through the managed VPN and logged to Microsoft Sentinel (SIEM). |
| 3.1.13 | Use cryptographic mechanisms to protect remote access sessions | Remote access is protected with FIPS 140-2 validated AES-256 over TLS 1.2 or higher. |
| 3.1.14 | Route remote access via managed access control points | Remote access is routed through a limited number of managed access control points (VPN concentrators). |
| 3.1.15 | Authorize remote execution of privileged commands | Remote execution of privileged commands and access to security-relevant information require explicit authorization and MFA. |
| 3.1.16 | Authorize wireless access prior to connection | Wireless access is authorized before connection and restricted to approved SSIDs. |
| 3.1.17 | Protect wireless access using authentication and encryption | Wireless access is protected with WPA2/WPA3-Enterprise authentication and encryption. |
| 3.1.18 | Control connection of mobile devices | Mobile device connections are controlled and enrolled in Microsoft Intune. |
| 3.1.19 | Encrypt CUI on mobile devices and platforms | CUI on mobile devices is encrypted using FIPS 140-2 validated AES-256 device encryption. |
| 3.1.20 | Verify and control connections to external systems | Connections to external systems are verified and limited by policy and technical controls; unmanaged devices are denied. |
| 3.1.21 | Limit use of portable storage devices on external systems | Use of portable storage on external systems is prohibited by policy and endpoint controls. |
| 3.1.22 | Control CUI posted on publicly accessible systems | CUI is prohibited from publicly accessible systems; public content is reviewed before posting. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Access Control, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_at:{title:"Awareness & Training (3.2)",clause:"3.2",content:`# Awareness & Training
_NIST SP 800-171 \xB7 3.2 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

| Practice | Requirement | Implementation |

| 3.2.1 | Make users aware of security risks of their activities | All users complete security awareness training at onboarding and annually, covering the risks of their activities. |
| 3.2.2 | Train personnel for assigned security duties | Personnel with security duties receive role-based training appropriate to their responsibilities. |
| 3.2.3 | Provide insider-threat awareness training | Awareness training includes recognizing and reporting insider-threat indicators. |

## Roles & Responsibilities

_NIST SP 800-171 \xB7 3.3 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to create and protect audit logs to enable monitoring and investigation, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Audit & Accountability controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.3.1 | Create and retain system audit logs and records | Audit logs are generated and retained at least one year in Microsoft Sentinel (SIEM) to support monitoring and investigation. |
| 3.3.2 | Ensure actions are uniquely traceable to individual users | Actions are uniquely traceable to individual users through unique IDs; shared accounts are prohibited. |
| 3.3.3 | Review and update logged events | Logged event types are reviewed and updated quarterly. |
| 3.3.4 | Alert on audit logging process failure | Alerts are generated on audit logging process failure. |
| 3.3.5 | Correlate audit review for investigation and response | Audit records are correlated and reviewed in Microsoft Sentinel (SIEM) for investigation and response. |
| 3.3.6 | Provide audit reduction and report generation | Audit reduction and on-demand reporting are provided by Microsoft Sentinel (SIEM). |
| 3.3.7 | Synchronize internal clocks with an authoritative source | System clocks are synchronized to an authoritative time source (NIST NTP) for accurate time stamps. |
| 3.3.8 | Protect audit information and tools from tampering | Audit information and logging tools are protected from unauthorized access and modification via access controls. |
| 3.3.9 | Limit management of audit logging to privileged users | Management of audit logging is limited to a defined subset of privileged users. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Audit & Accountability, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_cm:{title:"Configuration Management (3.4)",clause:"3.4",content:`# Configuration Management
_NIST SP 800-171 \xB7 3.4 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to establish and maintain secure baseline configurations, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Configuration Management controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.4.1 | Establish and maintain baseline configurations and inventories | Baseline configurations and asset inventories are established and maintained in Microsoft Intune / CMDB. |
| 3.4.2 | Establish and enforce security configuration settings | Security configuration settings are enforced against CIS / DISA STIG baselines. |
| 3.4.3 | Track, review, approve, and log changes | Changes are tracked, reviewed, approved, and logged through the change-management process. |
| 3.4.4 | Analyze security impact of changes before implementation | Security impact of changes is analyzed before implementation. |
| 3.4.5 | Define and enforce access restrictions for changes | Physical and logical access restrictions for changes are defined and enforced. |
| 3.4.6 | Employ least functionality | Least functionality is enforced; only essential capabilities are enabled. |
| 3.4.7 | Restrict nonessential programs, ports, protocols, services | Nonessential programs, ports, protocols, and services are restricted or disabled. |
| 3.4.8 | Apply deny-by-exception / permit-by-exception for software | Application allow-listing (permit-by-exception) controls software execution. |
| 3.4.9 | Control and monitor user-installed software | User-installed software is controlled and monitored via Microsoft Intune. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Configuration Management, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_ia:{title:"Identification & Authentication (3.5)",clause:"3.5",content:`# Identification & Authentication
_NIST SP 800-171 \xB7 3.5 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to identify and authenticate users and devices before access, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Identification & Authentication controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.5.1 | Identify users, processes, and devices | Users, processes, and devices are uniquely identified in Microsoft Entra ID. |
| 3.5.2 | Authenticate identities before access | Identities are authenticated before access is granted. |
| 3.5.3 | Use multifactor authentication for privileged and network access | MFA is required for privileged and network access using an authenticator app / FIDO2 security keys. |
| 3.5.4 | Employ replay-resistant authentication | Replay-resistant authentication is employed (e.g., Kerberos, FIDO2). |
| 3.5.5 | Prevent reuse of identifiers for a defined period | Identifier reuse is prevented for a defined period. |
| 3.5.6 | Disable identifiers after inactivity | Identifiers are disabled after 35 days of inactivity. |
| 3.5.7 | Enforce minimum password complexity | Password complexity requires a minimum of 14 characters. |
| 3.5.8 | Prohibit password reuse for a number of generations | Password reuse is prohibited for 24 generations. |
| 3.5.9 | Allow temporary passwords with immediate change | Temporary passwords require immediate change to a permanent password. |
| 3.5.10 | Store and transmit only cryptographically-protected passwords | Passwords are stored and transmitted only in cryptographically-protected form. |
| 3.5.11 | Obscure feedback of authentication information | Authentication feedback is obscured (masked entry). |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Identification & Authentication, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_ir:{title:"Incident Response (3.6)",clause:"3.6",content:`# Incident Response

Assessed at least annually and on significant change. Revision 1.0.`},fam_ma:{title:"Maintenance (3.7)",clause:"3.7",content:`# Maintenance
_NIST SP 800-171 \xB7 3.7 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy

_NIST SP 800-171 \xB7 3.8 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to protect and sanitize media containing CUI, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Media Protection controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.8.1 | Protect system media containing CUI, paper and digital | System media containing CUI (paper and digital) are physically controlled and securely stored. |
| 3.8.2 | Limit access to CUI on media to authorized users | Access to CUI on media is limited to authorized users. |
| 3.8.3 | Sanitize or destroy media before disposal or reuse | Media is sanitized or destroyed before disposal or reuse per NIST SP 800-88. |
| 3.8.4 | Mark media with CUI markings and distribution limits | Media is marked with CUI markings and distribution limitations. |
| 3.8.5 | Control and maintain accountability for media in transport | Media in transport is controlled and accountability maintained. |
| 3.8.6 | Use cryptographic mechanisms to protect CUI on media in transport | CUI on digital media in transport is encrypted with FIPS 140-2 validated AES-256. |
| 3.8.7 | Control the use of removable media | Use of removable media is controlled via Microsoft Intune policy. |
| 3.8.8 | Prohibit portable storage devices with no identifiable owner | Portable storage without an identifiable owner is prohibited. |
| 3.8.9 | Protect the confidentiality of backup CUI | Backup CUI is protected with encryption at the storage location. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Media Protection, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_ps:{title:"Personnel Security (3.9)",clause:"3.9",content:`# Personnel Security

## Procedure

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.

Implementation evidence, monitoring output, and POA&M entries for Personnel Security, retained per policy.

Assessed at least annually and on significant change. Revision 1.0.`},fam_pe:{title:"Physical Protection (3.10)",clause:"3.10",content:`# Physical Protection
_NIST SP 800-171 \xB7 3.10 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to limit physical access to systems and environments, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Physical Protection controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.10.1 | Limit physical access to systems and environments | Physical access to systems and facilities is limited to authorized individuals via badge access. |
| 3.10.2 | Protect and monitor the physical facility | Facilities and support infrastructure are protected and monitored (CCTV, alarms). |
| 3.10.3 | Escort visitors and monitor visitor activity | Visitors are escorted and their activity monitored. |
| 3.10.4 | Maintain audit logs of physical access | Physical access audit logs are maintained. |
| 3.10.5 | Control and manage physical access devices | Physical access devices (badges, keys) are controlled and managed. |
| 3.10.6 | Enforce safeguarding measures for CUI at alternate work sites | CUI safeguarding measures are enforced at alternate / remote work sites. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for Physical Protection, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_ra:{title:"Risk Assessment (3.11)",clause:"3.11",content:`# Risk Assessment

| 3.11.2 | Scan for vulnerabilities periodically and when identified | Vulnerability scans are performed monthly and when new vulnerabilities are identified. |

- **Security Lead** \u2014 accountable for this family's implementation and assessment.

Assessed at least annually and on significant change. Revision 1.0.`},fam_ca:{title:"Security Assessment (3.12)",clause:"3.12",content:`# Security Assessment
_NIST SP 800-171 \xB7 3.12 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to assess controls and maintain plans of action, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the Security Assessment controls to all in-scope systems (ServiceNow and CUI assets).

_NIST SP 800-171 \xB7 3.13 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to monitor and protect communications and system boundaries, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the System & Communications Protection controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.13.1 | Monitor, control, and protect communications at boundaries | Communications at external and key internal boundaries are monitored and protected via firewalls and Microsoft Sentinel (SIEM). |
| 3.13.2 | Employ secure architecture and engineering principles | Secure architecture and engineering principles are applied to system design. |
| 3.13.3 | Separate user functionality from system management | User functionality is separated from system management functionality. |
| 3.13.4 | Prevent unauthorized transfer via shared resources | Unauthorized information transfer via shared resources is prevented. |
| 3.13.5 | Implement subnetworks for publicly accessible components | Publicly accessible components are placed in a separated subnet (DMZ). |
| 3.13.6 | Deny network traffic by default, permit by exception | Network traffic is denied by default and permitted by exception (deny-all firewall posture). |
| 3.13.7 | Prevent split tunneling on remote devices | Split tunneling is prevented on remote devices. |
| 3.13.8 | Use cryptography to protect CUI in transmission | CUI in transmission is protected with FIPS 140-2 validated AES-256 over TLS 1.2 or higher. |
| 3.13.9 | Terminate network connections after inactivity | Network connections terminate after 30 minutes of inactivity or at session end. |
| 3.13.10 | Establish and manage cryptographic keys | Cryptographic keys are established and managed per a key-management procedure. |
| 3.13.11 | Employ FIPS-validated cryptography to protect CUI | FIPS 140-2 validated AES-256 (FIPS-validated) is employed to protect the confidentiality of CUI. |
| 3.13.12 | Prohibit remote activation of collaborative devices | Remote activation of collaborative computing devices is prohibited; in-use indication is provided. |
| 3.13.13 | Control and monitor use of mobile code | Mobile code is controlled and monitored. |
| 3.13.14 | Control and monitor use of VoIP | VoIP use is controlled and monitored. |
| 3.13.15 | Protect authenticity of communications sessions | Communications session authenticity is protected (TLS, signed sessions). |
| 3.13.16 | Protect the confidentiality of CUI at rest | CUI at rest is protected with FIPS 140-2 validated AES-256 encryption. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for System & Communications Protection, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`},fam_si:{title:"System & Information Integrity (3.14)",clause:"3.14",content:`# System & Information Integrity
_NIST SP 800-171 \xB7 3.14 \xB7 CMMC Level 2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to identify and correct flaws and protect against malicious code, protecting Controlled Unclassified Information (CUI) processed in support of the Enterprise IT Service Desk (EITSD) contract.

## Procedure
1. Apply the System & Information Integrity controls to all in-scope systems (ServiceNow and CUI assets).
2. Assign responsibility to the System Owner and Security Lead.
3. Operate and monitor the controls day to day.
4. Record evidence of implementation and effectiveness.
5. Remediate gaps via the Plan of Action & Milestones (POA&M).
6. Review at least annually and on significant change.

## Implementation of practices (NIST SP 800-171)
_The implementation column reflects the organization's configuration; confirm each value against your environment._

| Practice | Requirement | Implementation |
|---|---|---|
| 3.14.1 | Identify, report, and correct system flaws timely | System flaws are identified and remediated timely: critical within 30 days. |
| 3.14.2 | Provide protection from malicious code | Malicious code protection (Microsoft Defender for Endpoint (EDR)) is deployed at designated locations. |
| 3.14.3 | Monitor security alerts and advisories and act | Security alerts and advisories are monitored and acted upon. |
| 3.14.4 | Update malicious code protection mechanisms | Malicious code protection mechanisms are updated automatically. |
| 3.14.5 | Perform periodic and real-time scans | Periodic and real-time scans are performed on files from external sources. |
| 3.14.6 | Monitor systems and traffic to detect attacks | Systems and inbound/outbound traffic are monitored to detect attacks via Microsoft Sentinel (SIEM) / Microsoft Defender for Endpoint (EDR). |
| 3.14.7 | Identify unauthorized use of systems | Unauthorized use of systems is identified through monitoring and alerting. |

## Roles & Responsibilities
- **Security Lead** \u2014 accountable for this family's implementation and assessment.
- **System Owners** \u2014 implement and operate the controls on their systems.
- **All personnel** \u2014 comply and report issues.

## Required Records
Implementation evidence, monitoring output, and POA&M entries for System & Information Integrity, retained per policy.

## Review
Assessed at least annually and on significant change. Revision 1.0.`}},audit:{4:{"Assessment Checklist":`## CMMC / 800-171 Assessment Checklist \u2014 Family group 4

_ISO 9001:2015 \u2014 Clause 8.2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to determine, review and communicate requirements for the services before commitment, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Capture requirements from the contract and customer.
2. Review requirements for feasibility before committing (8.2.3).
3. Resolve differences between stated and contracted requirements.
4. Communicate with the customer on enquiries, changes and feedback.
5. Record requirement reviews and changes.
6. Handle customer property and feedback appropriately.

## Workflow
Requirement \u2192 review feasibility \u2192 commit \u2192 deliver \u2192 feedback \u2192 change control.

## Key Controls
| Control | Standard |
|---|---|
| Requirements review | Before commitment (8.2.3) |
| Change control | Documented |
| Customer communication | Defined channels |
| Feedback capture | Continuous |

## Roles & Responsibilities
- **Service Delivery Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Requirement reviews completed | 100% |
| Customer enquiries answered on time | \u2265 95% |

## Required Records
Requirement reviews, change records, and customer communications. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},serviceprovision:{title:"Service Provision (Operation)",clause:"8.1 / 8.5",content:`# Operational Planning & Service Provision
_ISO 9001:2015 \u2014 Clauses 8.1 & 8.5 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to plan and control service provision so outputs consistently meet requirements, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Plan delivery, resources and controls (8.1).
2. Control service provision against defined criteria (8.5).
3. Identify and trace outputs; preserve information.
4. Control changes to service provision.
5. Release only conforming services.
6. Monitor against acceptance criteria.

## Workflow
Plan \u2192 control provision \u2192 monitor \u2192 release conforming service \u2192 change control.

## RACI Matrix
| Activity | Service Delivery Manager | Team | Manager | Executive |
|---|---|---|---|---|
| Plan delivery | A | R | C | I |
| Control service provision | A | R | C | I |
| Release conforming output | R | R | A | I |
| Control changes | A | C | R | I |

_R = Responsible, A = Accountable, C = Consulted, I = Informed._

## Roles & Responsibilities
- **Service Delivery Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Services meeting acceptance criteria | \u2265 98% |
| Unplanned changes | Downward trend |

## Required Records
Service records, acceptance evidence, and change records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},purchasing:{title:"Control of External Providers",clause:"8.4",content:`# Control of Externally Provided Processes & Suppliers

## Procedure

2. Communicate requirements to providers.

5. Re-evaluate and re-approve providers periodically.
6. Address provider nonconformities.

| Requirements to suppliers | Documented |

_ISO 9001:2015 \u2014 Clause 8.7 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to identify and control outputs that do not conform, to prevent unintended use, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Identify and segregate nonconforming output.
2. Correct, or obtain concession where appropriate.
3. Record the nonconformity and action taken.
4. Verify conformity after correction.
5. Raise corrective action where recurrence is likely.

## Workflow
Detect nonconformity \u2192 segregate \u2192 correct/concession \u2192 verify \u2192 record \u2192 corrective action.

## Key Controls
| Control | Standard |
|---|---|
| Identification | Marked & segregated |
| Disposition | Correct / concession / reject |
| Verification | Re-checked |
| Records | Retained |

## Roles & Responsibilities
- **Quality Manager** \u2014 owns this area; accountable for its outcomes.

| Metric | Target |
|---|---|

Nonconformity records and disposition decisions. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},monitoring:{title:"Monitoring, Measurement & Customer Satisfaction",clause:"9.1",content:`# Monitoring, Measurement & Customer Satisfaction

_ISO 22301:2019 \u2014 Clause 8.3 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to select strategies and solutions that meet the recovery objectives from the BIA, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Derive requirements from the BIA (RTO/RPO/MTPD).
2. Identify options for people, premises, technology and suppliers.
3. Select strategies that meet objectives at justifiable cost.
4. Provision the required resources.
5. Document solution details and dependencies.
6. Validate against the BIA.

## Workflow
BIA requirements \u2192 options \u2192 selection \u2192 provision \u2192 validate.

## Key Controls
| Control | Standard |
|---|---|
| Meet RTO/RPO | Redundancy; frequent backups; tested restore |
| Site loss | Remote-work + alternate site |
| Staffing | Cross-training; on-call |
| Platform | Provider resilience + failover |

## Roles & Responsibilities
- **Continuity Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Strategies meeting BIA targets | 100% |
| Provisioned resources ready | 100% |

## Required Records
The strategy document and resource provisioning records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},plans:{title:"Business Continuity Plans",clause:"8.4",content:`# Business Continuity Plans
_ISO 22301:2019 \u2014 Clause 8.4 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to provide documented procedures to continue and recover critical activities, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Define activation criteria and authority.
2. Establish the incident response team and roles.
3. Set out communications (staff, \${c.CUST}, suppliers).
4. Document recovery procedures per critical activity to meet RTO/RPO.
5. List resources and dependencies.
6. Define return-to-normal criteria.

## Workflow
Activation \u2192 mobilize team \u2192 communicate \u2192 recover per procedure \u2192 return to normal.

## Key Controls
| Control | Standard |
|---|---|
| Activation criteria | Defined & authorized |
| Team & roles | Named |
| Communications | Pre-drafted |
| Recovery procedures | Per critical activity |

## Roles & Responsibilities
- **Continuity Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Plans covering critical activities | 100% |
| Plans accessible during disruption | Yes |

## Required Records
Continuity plans, contact lists, and recovery procedures. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},incident:{title:"Incident Response Structure",clause:"8.4.2",content:`# Incident Response Structure
_ISO 22301:2019 \u2014 Clause 8.4.2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to provide a defined structure to respond to disruptive incidents, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Detect and assess the incident's severity.
2. Activate the response structure and escalate.
3. Establish command, safety and communications.
4. Coordinate recovery per the plans.
5. Communicate with \${c.CUST} and stakeholders.
6. Stand down and review after resolution.

## Workflow
Detect \u2192 assess \u2192 activate \u2192 command \u2192 recover \u2192 communicate \u2192 stand down \u2192 review.

## RACI Matrix
| Activity | Incident Manager | Team | Manager | Executive |
|---|---|---|---|---|
| Assess & declare | A | R | C | I |
| Activate response | A | R | C | I |
| Coordinate recovery | R | R | A | I |
| Stakeholder comms | R | C | A | C |

_R = Responsible, A = Accountable, C = Consulted, I = Informed._

## Roles & Responsibilities
- **Incident Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Time to activate | Within target |
| Post-incident reviews | 100% |

## Required Records
Incident logs, decisions, and post-incident reviews. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},exercise:{title:"Exercising & Testing Programme",clause:"8.5",content:`# Exercising & Testing Programme
_ISO 22301:2019 \u2014 Clause 8.5 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to validate the plans and build capability through a programme of exercises, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Plan a programme of exercises across plan types.
2. Run tabletop walkthroughs of the plans.
3. Run technical recovery / failover tests.
4. Test communications and notifications.
5. Capture findings and lessons.
6. Update plans and re-test as needed.

## Workflow
Plan programme \u2192 tabletop \u2192 technical test \u2192 comms test \u2192 findings \u2192 update.

## Key Controls
| Control | Standard |
|---|---|
| Plan walkthrough | Semi-annual |
| Recovery / failover | Annual |
| Communications test | Annual |
| Findings | Tracked to closure |

## Roles & Responsibilities
- **Continuity Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Exercises completed | Per programme |
| Recovery within RTO in tests | 100% |

## Required Records
Exercise plans, results, and improvement actions. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},performance:{title:"Performance Evaluation",clause:"9.1",content:`# Performance Evaluation

_ISO 22301:2019 \u2014 Clause 9.2 \xB7 Meridian Federal Solutions_

## Procedure

2. Assign impartial auditors (not auditing their own work).
3. Conduct audits against the standard and this system.
4. Record findings (conformities and nonconformities).
5. Raise corrective actions and track to closure.
6. Report results to management review.

|---|---|

| Evidence | Sampled records, interviews |
| Output | Audit report + actions |`},mgmtreview:{title:"Management Review",clause:"9.3",content:`# Management Review

_ISO/IEC 42001:2023 \u2014 Clause 5.2 \xB7 Meridian Federal Solutions_

Meridian Federal Solutions, LLC develops and uses AI systems responsibly in delivering the Enterprise IT Service Desk (EITSD) contract, under an AIMS conforming to ISO/IEC 42001:2023.

- Assess AI risks and impacts on people and society.
- Ensure human oversight, transparency and data governance.
- Manage AI across its lifecycle.
- Meet legal and ethical obligations; continually improve.

| Version | Date | Approved by |
|---|---|---|
| 1.0 | (current) | Program Manager |`},aimsscope:{title:"AIMS Scope",clause:"4.3",content:`# Scope of the AIMS
_ISO/IEC 42001:2023 \u2014 Clause 4.3 \xB7 Meridian Federal Solutions_

Covers AI systems used or provided in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce (e.g. AI-assisted support and automation on ServiceNow). Governing standard: ISO/IEC 42001:2023, clauses 4\u201310 and Annex A.`},context:{title:"Context & Interested Parties",clause:"4.1 / 4.2",content:`# Context & Interested Parties

_ISO/IEC 42001:2023 \u2014 Annex A \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to ensure AI is built and run on appropriate, well-governed data, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Document data sources and permitted uses.
2. Validate data quality for the AI purpose.
3. Exclude sensitive data unless controlled.
4. Record data provenance.
5. Apply retention and disposal rules.
6. Review data governance on AI change.

## Workflow
Source \u2192 permitted use \u2192 quality check \u2192 provenance \u2192 retention \u2192 review.

## Key Controls
| Control | Standard |
|---|---|
| Data sources | Documented; permitted use |
| Data quality | Validated |
| Sensitive data | Controlled / excluded |
| Provenance | Recorded |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| AI systems with documented data lineage | 100% |
| Sensitive-data exposure to AI | 0 |

## Required Records
Data source register, quality checks, and provenance records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},soa:{title:"Statement of Applicability (Annex A)",clause:"6.1.3",content:`# Statement of Applicability
_ISO/IEC 42001:2023 \u2014 Annex A \xB7 Meridian Federal Solutions_

This Statement of Applicability lists the ISO/IEC 42001:2023 Annex A controls, their applicability to the AI management system for the Enterprise IT Service Desk (EITSD) contract, and how each is implemented. Exclusions are justified by the AI risk and impact assessments.

### A.2 Policies related to AI

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.2.2 | AI policy | Yes | AI Management Policy approved by top management and communicated |
| A.2.3 | Alignment with other organizational policies | Yes | AI policy aligned with security, privacy, and quality policies |
| A.2.4 | Review of the AI policy | Yes | AI policy reviewed at least annually and on significant change |

### A.3 Internal organization

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.3.2 | AI roles and responsibilities | Yes | AI Owner, reviewers, and Security Lead roles defined and assigned |
| A.3.3 | Reporting of concerns | Yes | Channel provided to report AI concerns and issues |

### A.4 Resources for AI systems

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.4.2 | Resource documentation | Yes | AI resources (data, tooling, compute, people) documented |
| A.4.3 | Data resources | Yes | Data resources for AI documented and governed |
| A.4.4 | Tooling resources | Yes | AI tools and models inventoried |
| A.4.5 | System and computing resources | Yes | Compute and hosting resources documented |
| A.4.6 | Human resources | Yes | Competence for AI oversight defined and resourced |

### A.5 Assessing impacts of AI systems

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.5.2 | AI system impact assessment process | Yes | Documented impact-assessment process performed before deployment |
| A.5.3 | Documentation of AI system impact assessments | Yes | Impact assessments recorded and retained |
| A.5.4 | Assessing impact on individuals or groups | Yes | Impacts on individuals assessed (harms, bias, recourse) |
| A.5.5 | Assessing societal impacts | Yes | Broader societal impacts assessed and mitigated |

### A.6 AI system life cycle

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.6.1.2 | Objectives for responsible development | Yes | Responsible-AI objectives defined for development |
| A.6.1.3 | Processes for responsible design and development | Yes | Design/development follows responsible-AI processes |
| A.6.2.2 | AI system requirements and specification | Yes | Requirements including safety, fairness, and oversight specified |
| A.6.2.3 | Documentation of design and development | Yes | Design and development documented |
| A.6.2.4 | AI system verification and validation | Yes | Performance and fairness validated before deployment |
| A.6.2.5 | AI system deployment | Yes | Deployment with human oversight and rollback |
| A.6.2.6 | AI system operation and monitoring | Yes | Accuracy and drift monitored in operation |
| A.6.2.7 | AI system technical documentation | Yes | Technical documentation maintained |
| A.6.2.8 | AI system recording of event logs | Yes | AI event logs recorded and retained |

### A.7 Data for AI systems

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.7.2 | Data for development and enhancement | Yes | Data used for AI documented and permitted |
| A.7.3 | Acquisition of data | Yes | Data acquisition controlled and lawful |
| A.7.4 | Quality of data for AI systems | Yes | Data quality validated for the AI purpose |
| A.7.5 | Data provenance | Yes | Provenance of AI data recorded |
| A.7.6 | Data preparation | Yes | Data preparation documented and controlled |

### A.8 Information for interested parties

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.8.2 | System documentation and information for users | Yes | Users informed AI is assisting; usage documented |
| A.8.3 | External reporting | Yes | External reporting mechanism provided |
| A.8.4 | Communication of incidents | Yes | AI incidents communicated to affected parties |
| A.8.5 | Information for interested parties | Yes | Interested parties given relevant AI information |

### A.9 Use of AI systems

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.9.2 | Processes for responsible use | Yes | Responsible-use processes defined |
| A.9.3 | Objectives for responsible use | Yes | Responsible-use objectives set and tracked |
| A.9.4 | Intended use of the AI system | Yes | Intended use defined; misuse controls in place |

### A.10 Third-party and customer relationships

| Control | Title | Applicable | Implementation |
|---|---|---|---|
| A.10.2 | Allocating responsibilities | Yes | Responsibilities allocated across third parties |
| A.10.3 | Suppliers | Yes | AI supplier assurance obtained where used |
| A.10.4 | Customers | Yes | Customer obligations and information addressed |

All 38 Annex A controls are applicable and implemented as above, confirmed by the AI risk and impact assessments.`},lifecycle:{title:"AI System Lifecycle Controls",clause:"Annex A",content:`# AI System Lifecycle Management
_ISO/IEC 42001:2023 \u2014 Annex A \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to manage AI systems responsibly across design, deployment, operation and retirement, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Define intended use and requirements.
2. Assess risk and impact before build/procurement.
3. Validate performance and fairness before deployment.
4. Deploy with human oversight and monitoring.
5. Monitor accuracy and drift in operation.
6. Retire or retrain when performance degrades.

## Workflow
Define \u2192 assess \u2192 validate \u2192 deploy (oversight) \u2192 monitor \u2192 retrain/retire.

## Key Controls
| Control | Standard |
|---|---|
| Pre-deployment validation | Performance & fairness |
| Oversight | Human-in-the-loop |
| Monitoring | Accuracy & drift |
| Retirement | On degradation |

## Roles & Responsibilities
- **AI Owner** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| AI systems validated pre-deployment | 100% |
| Monitored in operation | 100% |

## Required Records
Validation reports, monitoring logs, and change/retirement records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},oversight:{title:"Human Oversight & Transparency",clause:"Annex A",content:`# Human Oversight & Transparency

_SOC 2 (AICPA TSC) \u2014 CC4 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to monitor that controls are present and operating effectively, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure

3. Perform internal control reviews / audits.
4. Track deficiencies to remediation.
5. Report control status to management.
6. Improve controls based on findings.

Define monitoring \u2192 collect evidence \u2192 review \u2192 remediate \u2192 report.

| Control | Standard |
|---|---|
| Continuous monitoring | Security & availability |
| Internal review | Periodic |
| Deficiency tracking | To closure |
| Reporting | To management |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.

## Metrics & Targets
| Metric | Target |
|---|---|
| Controls monitored | 100% |
| Deficiencies remediated on time | \u2265 90% |

Reviewed at least annually and on significant change. Revision 1.0.`},access:{title:"Logical & Physical Access",clause:"CC6",content:`# Logical & Physical Access
_SOC 2 (AICPA TSC) \u2014 CC6 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to restrict logical and physical access to authorized users and protect information assets, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Provision access via RBAC and least privilege (CC6.1).
2. Require MFA for remote and privileged access.
3. Review access rights periodically (CC6.2).
4. Deprovision on termination (CC6.3).
5. Control physical access to facilities (CC6.4).
6. Encrypt data in transit and at rest (CC6.7).

## Workflow
Provision (RBAC+MFA) \u2192 review \u2192 deprovision \u2192 physical controls \u2192 encryption.

## Key Controls
| Control | Standard |
|---|---|
| Access provisioning | RBAC; least privilege |
| Authentication | MFA |
| Access reviews | Quarterly |
| Encryption | In transit & at rest |

## Roles & Responsibilities
- **Security Lead** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Access reviews completed | 100% quarterly |
| MFA coverage (remote/privileged) | 100% |

## Required Records
Access records, review logs, and encryption configuration. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},operations:{title:"System Operations & Incident Response",clause:"CC7",content:`# System Operations & Incident Response
_SOC 2 (AICPA TSC) \u2014 CC7 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to detect, respond to, and recover from security and availability incidents, in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce across ServiceNow (9,200 users, 14 sites). Defined, measured and continually improved.

## Procedure
1. Monitor systems for anomalies and threats (CC7.1\u20137.2).
2. Detect and classify incidents.
3. Contain, eradicate and recover (CC7.3\u20137.4).
4. Notify affected parties (CC7.5).
5. Preserve evidence and review post-incident.
6. Improve controls from lessons learned.

## Workflow
Monitor \u2192 detect \u2192 contain \u2192 recover \u2192 notify \u2192 review.

## Key Controls
| Control | Standard |
|---|---|
| Monitoring | Security & availability |
| Incident handling | Detect\u2192respond\u2192recover |
| Communication | Affected parties |
| Post-incident review | For majors |

| Metric | Target |
|---|---|
| Incidents reviewed | 100% |
| Mean time to respond | Within target |

Reviewed at least annually and on significant change. Revision 1.0.`},change:{title:"Change Management",clause:"CC8",content:`# Change Management

_ISO 28000:2022 \u2014 Clause 5.2 \xB7 Meridian Federal Solutions_

Meridian Federal Solutions, LLC maintains the security of its supply chain and operations in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce, under a security management system conforming to ISO 28000:2022.

- Protect people, assets, information and consignments from security threats.
- Assess security risk across the supply chain, including partners and transport.
- Maintain chain of custody for controlled and sensitive items.
- Meet contractual, regulatory and customs security obligations.
- Continually improve security performance.

| 1.0 | (current) | Program Manager |`},smsscope:{title:"Security Management Scope",clause:"4.3",content:`# Scope of the Security Management System
