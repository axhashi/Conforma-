_ISO 28000:2022 \u2014 Clause 8.1 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to maintain an unbroken, documented chain of custody for every controlled consignment handled in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce. Defined, measured and continually improved.

## Procedure
1. Record receipt: item, identifiers, condition, seal number, time, receiving officer.
2. Verify seal integrity and documentation against the manifest at every handoff.
3. Store controlled items in designated secure areas with restricted access.
4. Record every custody transfer with both parties identified and signed.
5. Escort or track controlled items in transit per their classification.
6. Confirm delivery, verify seal, and record acceptance by the consignee.
7. Investigate and report any discrepancy or seal anomaly immediately.

## Workflow
Receipt & seal check \u2192 secure storage \u2192 authorized release \u2192 tracked transit \u2192 delivery verification \u2192 custody record closed.

## Key Controls
| Control | Standard |
|---|---|
| Seal integrity | Verified and recorded at every handoff |
| Custody record | Complete, attributable, time-stamped |
| Secure storage | Access-controlled, monitored areas |
| Discrepancy handling | Reported within defined time |

## Roles & Responsibilities
- **Transport Security Lead** \u2014 owns this area; accountable for its outcomes.
- **Receiving / dispatch staff** \u2014 perform the work and record it.
- **Security Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Complete custody records | 100% |
| Seal discrepancies | 0 |

## Required Records
Receipt logs, seal registers, custody transfer records, delivery confirmations. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},physicalsecurity:{title:"Physical & Facility Security",clause:"8.2",content:`# Physical & Facility Security
_ISO 28000:2022 \u2014 Clause 8.2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to protect facilities, secure storage areas and assets against unauthorized access, damage and interference, across 14 sites. Defined, measured and continually improved.

## Procedure
1. Define security zones and their access requirements.
2. Control entry with badge access and visitor management.
3. Maintain caged or otherwise segregated storage for controlled assets.
4. Monitor sites with CCTV and alarm systems; retain footage per policy.
5. Conduct perimeter and area inspections on a defined schedule.
6. Review access rights periodically and on role change.

## Workflow
Zone definition \u2192 access control \u2192 monitoring \u2192 inspection \u2192 access review.

## Key Controls
| Control | Standard |
|---|---|
| Access control | Badge; least privilege by zone |
| Secure storage | Segregated, locked, monitored |
| Surveillance | CCTV with defined retention |
| Visitor management | Registered and escorted |
| Inspections | Scheduled and recorded |

## Roles & Responsibilities
- **Facility Security Officer** \u2014 owns this area; accountable for its outcomes.
- **Site staff** \u2014 perform the work and record it.
- **Security Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Access reviews completed | 100% quarterly |
| Unauthorized access events | 0 |

## Required Records
Access logs, visitor registers, inspection records, CCTV retention records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},transport:{title:"Transport & In-Transit Security",clause:"8.3",content:`# Transport & In-Transit Security
_ISO 28000:2022 \u2014 Clause 8.3 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to protect consignments in transit against theft, tampering and diversion in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce. Defined, measured and continually improved.

## Procedure
1. Assess route and destination risk before dispatch.
2. Apply tamper-evident seals and record seal numbers.
3. Assign vetted drivers/carriers; verify identity at collection.
4. Track vehicles and consignments in transit.
5. Define and rehearse deviation, delay and duress procedures.
6. Verify seals and condition on arrival; record any exception.

## Workflow
Route risk assessment \u2192 seal & dispatch \u2192 vetted carrier \u2192 tracking \u2192 arrival verification.

## Key Controls
| Control | Standard |
|---|---|
| Route risk | Assessed before dispatch |
| Seals | Tamper-evident; numbers recorded |
| Carrier vetting | Verified before collection |
| Tracking | Continuous for controlled loads |
| Exception handling | Reported immediately |

## Roles & Responsibilities
- **Transport Security Lead** \u2014 owns this area; accountable for its outcomes.
- **Dispatch & drivers** \u2014 perform the work and record it.
- **Security Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Loads with verified seals on arrival | 100% |
| In-transit losses | 0 |

## Required Records
Route assessments, seal registers, carrier vetting records, tracking logs. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},personnel:{title:"Personnel Security & Screening",clause:"8.4",content:`# Personnel Security & Screening
_ISO 28000:2022 \u2014 Clause 8.4 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to ensure personnel with access to controlled assets, secure areas or supporting systems are screened, trained and supervised proportionate to risk. Defined, measured and continually improved.

## Procedure
1. Define screening requirements by role and access level.
2. Complete background screening before granting access.
3. Issue access on the principle of least privilege.
4. Train personnel in security duties and reporting.
5. Supervise and periodically re-verify access needs.
6. Withdraw access promptly on role change or exit.

## Workflow
Role risk \u2192 screening \u2192 least-privilege access \u2192 training \u2192 periodic review \u2192 withdrawal on exit.

## Key Controls
| Control | Standard |
|---|---|
| Pre-access screening | Completed and recorded |
| Least privilege | Access matched to role |
| Security training | At onboarding and annually |
| Exit process | Access withdrawn same day |

## Roles & Responsibilities
- **Security Manager** \u2014 owns this area; accountable for its outcomes.
- **HR & line managers** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Personnel screened before access | 100% |
| Access withdrawn on exit (same day) | 100% |

## Required Records
Screening records, access authorizations, training records, exit checklists. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},partners:{title:"Supply Chain Partner Security",clause:"8.5",content:`# Supply Chain Partner Security
_ISO 28000:2022 \u2014 Clause 8.5 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to assess and contractually bind supply-chain partners to security requirements proportionate to the risk they carry. Defined, measured and continually improved.

## Procedure
1. Identify partners handling controlled assets or data.
2. Assess partner security before engagement.
3. Flow down security requirements in contracts.
4. Verify partner compliance periodically.
5. Monitor partner security performance and incidents.
6. Offboard partners securely, recovering assets and access.

## Workflow
Identify \u2192 assess \u2192 contract flow-down \u2192 verify \u2192 monitor \u2192 offboard.

## Key Controls
| Control | Standard |
|---|---|
| Partner assessment | Before engagement |
| Contractual flow-down | Security clauses required |
| Verification | Periodic; risk-based |
| Incident reporting | Required of partners |

## Roles & Responsibilities
- **Security Manager** \u2014 owns this area; accountable for its outcomes.
- **Procurement** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Critical partners assessed | 100% |
| Contracts with security flow-down | 100% |

## Required Records
Partner register, assessments, contracts, verification records. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},incident:{title:"Security Incident Management",clause:"8.6",content:`# Security Incident Management
_ISO 28000:2022 \u2014 Clause 8.6 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to detect, respond to, investigate and learn from security incidents affecting the supply chain. Defined, measured and continually improved.

## Procedure
1. Report suspected incidents immediately via the defined channel.
2. Assess severity and secure the scene / consignment.
3. Notify U.S. Department of Commerce and authorities where required.
4. Investigate and determine root cause.
5. Recover and restore secure operations.
6. Implement corrective action and record lessons learned.

## Workflow
Report \u2192 assess & secure \u2192 notify \u2192 investigate \u2192 recover \u2192 corrective action.

## RACI Matrix
| Activity | Security Manager | Site/Transport staff | Program Manager | Executive |
|---|---|---|---|---|
| Detect & report | A | R | I | I |
| Assess & contain | A | R | C | I |
| Notify customer/authorities | R | I | A | C |
| Investigate & root cause | A | C | I | I |
| Corrective action | R | R | A | I |

_R = Responsible, A = Accountable, C = Consulted, I = Informed._

## Roles & Responsibilities
- **Security Manager** \u2014 owns this area; accountable for its outcomes.
- **Team** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Incidents reported within target time | 100% |
| Investigations closed with corrective action | 100% |

## Required Records
Incident reports, investigation findings, notifications, corrective actions. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},continuity:{title:"Security Continuity & Resilience",clause:"8.7",content:`# Security Continuity & Resilience
_ISO 28000:2022 \u2014 Clause 8.7 \xB7 Meridian Federal Solutions_

Security arrangements are maintained during disruption. Continuity measures cover loss of a facility, loss of a transport route, partner failure and systems outage.

| Site inaccessible | Divert to alternate secure facility | Facility Security Officer |
| Route compromised | Pre-approved alternate routing | Transport Security Lead |
| Partner failure | Approved alternate partner list | Security Manager |
| Systems outage | Manual custody records; reconcile on restore | Security Manager |

Arrangements are exercised at least annually and integrated with business continuity planning.`},exercise:{title:"Security Exercising & Testing",clause:"8.8",content:`# Security Exercising & Testing

_ISO 14001:2015 \u2014 Clause 5.2 \xB7 Meridian Federal Solutions_

Meridian Federal Solutions, LLC manages the environmental impacts of its operations in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce, under an environmental management system conforming to ISO 14001:2015.

- Protect the environment and prevent pollution.
- Fulfil compliance obligations, including legal requirements.
- Control significant environmental aspects across the lifecycle.
- Set and review environmental objectives.
- Continually improve environmental performance.

| Version | Date | Approved by |
|---|---|---|
| 1.0 | (current) | Program Manager |`},emsscope:{title:"EMS Scope",clause:"4.3",content:`# Scope of the EMS
_ISO 14001:2015 \u2014 Clause 4.3 \xB7 Meridian Federal Solutions_

Covers the activities, facilities, equipment and services used to deliver the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce, across 14 sites supporting ~9,200 users \u2014 including energy use, waste and electronic-equipment disposal, transport, and procurement. Governing standard: ISO 14001:2015, clauses 4\u201310.`},context:{title:"Context & Interested Parties",clause:"4.1 / 4.2",content:`# Context & Interested Parties

| U.S. Department of Commerce | Compliant, sustainable delivery; reporting |
| Regulators | Compliance with environmental law and permits |
| Employees | Safe, responsible workplace practices |
| Local community | Minimal nuisance, emissions and waste impact |
| Suppliers | Aligned environmental requirements |

External issues (regulation, climate expectations, energy market) and internal issues (facilities, equipment lifecycle, resourcing) are reviewed at management review.`},leadership:{title:"Leadership & Environmental Roles",clause:"5.1 / 5.3",content:`# Leadership & Environmental Roles

| All personnel | Follow environmental procedures; report incidents |`},aspects:{title:"Environmental Aspects & Impacts Register",clause:"6.1.2",content:`# Environmental Aspects & Impacts Register

_ISO 14001:2015 \u2014 Clause 8.1 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to plan, implement and control the operations associated with its significant environmental aspects in delivering the Enterprise IT Service Desk (EITSD) contract to U.S. Department of Commerce. Defined, measured and continually improved.

## Procedure
1. Establish operating criteria for each significant aspect.
2. Implement controls at the facility, equipment and process level.
3. Apply a lifecycle perspective to design, procurement and disposal.
4. Communicate environmental requirements to suppliers and contractors.
5. Monitor operations against the operating criteria.
6. Maintain records demonstrating control.

## Workflow
Operating criteria \u2192 controls \u2192 lifecycle & supplier requirements \u2192 monitoring \u2192 records.

## Key Controls
| Control | Standard |
|---|---|
| Energy management | Monitored; efficiency measures applied |
| Waste segregation | At source; licensed disposal |
| IT equipment disposal | Certified WEEE recycler; certificates retained |
| Procurement | Lifecycle criteria applied |
| Contractor control | Environmental requirements flowed down |

## Roles & Responsibilities
- **Environmental Manager** \u2014 owns this area; accountable for its outcomes.
- **Facilities & process owners** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Operations within operating criteria | 100% |
| Waste diverted from landfill | \u2265 75% |

## Required Records
Operating criteria, monitoring records, waste transfer notes, disposal certificates. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},lifecycle:{title:"Lifecycle Perspective & Procurement",clause:"8.1",content:`# Lifecycle Perspective & Procurement
_ISO 14001:2015 \u2014 Clause 8.1 \xB7 Meridian Federal Solutions_

Environmental requirements are applied across the lifecycle of goods and services:

| Stage | Requirement |
|---|---|
| Design / specification | Energy efficiency and repairability considered |
| Procurement | Environmental criteria in supplier selection |
| Delivery & use | Efficient operation; consumption monitored |
| Maintenance | Extend useful life; responsible parts handling |
| End of life | Certified reuse or recycling; certificates retained |

Requirements are communicated to suppliers and contractors and verified in supplier reviews.`},emergency:{title:"Emergency Preparedness & Response",clause:"8.2",content:`# Emergency Preparedness & Response
_ISO 14001:2015 \u2014 Clause 8.2 \xB7 Meridian Federal Solutions \xB7 U.S. Department of Commerce_

## Policy
It is Meridian Federal Solutions's policy to prepare for and respond to environmental emergencies to prevent or mitigate adverse impacts. Defined, measured and continually improved.

## Procedure
1. Identify potential emergency situations (spill, fire, release).
2. Document response procedures for each situation.
3. Provide containment equipment and train responders.
4. Test the response periodically.
5. Review and revise after tests and actual events.
6. Communicate relevant procedures to interested parties.

## Workflow
Identify scenarios \u2192 procedures \u2192 equipment & training \u2192 test \u2192 review.

## Key Controls
| Control | Standard |
|---|---|
| Scenario identification | Documented and current |
| Response procedures | Available at point of use |
| Containment equipment | Provided and inspected |
| Testing | At least annual |

## Roles & Responsibilities
- **Environmental Manager** \u2014 owns this area; accountable for its outcomes.
- **Site staff** \u2014 perform the work and record it.
- **Manager** \u2014 accountable for performance.
- **Executive / Program Manager** \u2014 owns the U.S. Department of Commerce relationship; approves resources.

## Metrics & Targets
| Metric | Target |
|---|---|
| Response tests completed | Per programme |
| Environmental incidents | 0 |

## Required Records
Scenario assessments, response procedures, test records, incident reports. Retained per the records procedure.

## Review
Reviewed at least annually and on significant change. Revision 1.0.`},monitoring:{title:"Monitoring, Measurement, Analysis & Evaluation",clause:"9.1.1",content:`# Monitoring, Measurement, Analysis & Evaluation

_ISO 14001:2015 \u2014 Clause 9.1.2 \xB7 Meridian Federal Solutions_

6. Report status to management review.

| Evidence | Permits, records, certificates, inspections |
| Non-compliance | Corrective action raised and tracked |
| Output | Documented compliance status |`},performance:{title:"Environmental Performance Evaluation",clause:"9.1",content:`# Environmental Performance Evaluation

_ISO 14001:2015 \u2014 Clause 7.5 \xB7 Meridian Federal Solutions_

## Procedure

2. Review and approve before publication.
3. Version as Major.Minor; record version, date, approver.

5. Review at least annually and on significant change.
6. Archive superseded versions.

|---|---|

_ISO 14001:2015 \u2014 Clause 9.2 \xB7 Meridian Federal Solutions_

## Procedure
1. Plan an annual audit programme covering all clauses/controls.
2. Assign impartial auditors (not auditing their own work).
3. Conduct audits against the standard and this system.
4. Record findings (conformities and nonconformities).
5. Raise corrective actions and track to closure.
6. Report results to management review.

| Element | Standard |
|---|---|
| Frequency | At least annual; risk-based |
| Auditor independence | Required |
| Evidence | Sampled records, interviews |
| Output | Audit report + actions |`},mgmtreview:{title:"Management Review",clause:"9.3",content:`# Management Review
_ISO 14001:2015 \u2014 Clause 9.3 \xB7 Meridian Federal Solutions_

|---|---|
| Status of prior actions | Decisions on improvement |
| Objective & KPI performance | Resource decisions |
| Audit results & nonconformities | Changes to the system |
| Customer feedback / satisfaction | Updated objectives |
| Risks & opportunities | Action assignments |

Minutes are recorded and retained as evidence.`},improvement:{title:"Nonconformity, Corrective Action & Improvement",clause:"10.1 / 10.2",content:`# Nonconformity, Corrective Action & Improvement
_ISO 14001:2015 \u2014 Clauses 10.1 & 10.2 \xB7 Meridian Federal Solutions_

## Procedure
1. Identify and record the nonconformity.
2. Contain and correct the immediate issue.
3. Analyse the root cause.
4. Implement corrective action to prevent recurrence.
5. Verify effectiveness and close.
6. Feed improvement opportunities into the register.

| Field | Example |
|---|---|
| Source | Audit, complaint, incident, KPI miss |
| Correction | Immediate fix |
| Corrective action | Root-cause removal |
| Verification | Effectiveness confirmed |

Continual improvement is driven through the register, reviewed at management review.`}},audit:{4:{"Audit Checklist":`## Internal Audit Checklist \u2014 Clause 4 (Context)

.cf-land{--lp:#F5F2EA;--lp2:#FFFFFF;--ldot:#E4DFD1;--li:#151B24;--li2:#565F6B;--li3:#949BA6;--lline:#E7E2D5;--lline2:#D6D0C0;--lnavy:#132038;--lnavy2:#1E3252;--lbrass:#B4842B;--lbrass2:#D2A343;--lbrasss:#F6EDD5;--lbrassl:#E6D3A3;--lem:#1F7A5C;--lem2:#2FA37E;--lems:#E3F2EB;background:var(--lp);color:var(--li);background-image:radial-gradient(var(--ldot) 1px,transparent 1px);background-size:22px 22px;font-family:'IBM Plex Sans',system-ui,sans-serif;height:100%;overflow-y:auto;overflow-x:hidden}
.cf-land .wr{max-width:600px;margin:0 auto;padding:0 14px}
.cf-land a{color:inherit;text-decoration:none}
.cf-land button{font-family:inherit;cursor:pointer}
.cf-land .serif{font-family:'Fraunces',Georgia,serif}
.cf-land .mono{font-family:'IBM Plex Mono',monospace}
@keyframes cflfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cflmarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cflstamp{0%{opacity:0;transform:scale(1.5) rotate(-13deg)}55%{opacity:1;transform:scale(.9) rotate(-11deg)}75%{transform:scale(1.04) rotate(-11deg)}100%{opacity:1;transform:scale(1) rotate(-11deg)}}
.cf-land nav{position:sticky;top:10px;z-index:60;margin:10px 0 0;background:var(--lp2);border:1px solid var(--lline);border-radius:999px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 22px rgba(21,27,36,.06)}
.cf-land .lg{display:flex;align-items:center;gap:11px}
.cf-land .lg b{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--li)}
.cf-land .navcta{background:var(--lnavy);color:#fff;border:0;border-radius:999px;padding:10px 17px;font-size:14px;font-weight:600}
.cf-land .navcta:hover{background:var(--lnavy2)}
.cf-land .hero{padding:46px 20px 0;text-align:center}
.cf-land .yb{display:inline-flex;align-items:center;gap:9px;background:var(--lp2);border:1px solid var(--lline);border-radius:999px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600;margin-bottom:24px}
.cf-land .yb .o{padding:2px 9px;border-radius:999px;background:var(--lnavy);color:var(--lbrass2);font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.cf-land h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(40px,10.2vw,54px);line-height:1.03;letter-spacing:-.02em;color:var(--li)}
.cf-land h1 em{font-style:italic;color:var(--lbrass)}
.cf-land .hero p{color:var(--li2);font-size:16.5px;line-height:1.6;margin:22px auto 0;max-width:35ch}
.cf-land .cta{margin-top:28px;background:var(--lnavy);color:#fff;border:0;border-radius:999px;padding:18px 30px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:11px;box-shadow:0 12px 30px rgba(19,32,56,.24)}
.cf-land .cta:hover{background:var(--lnavy2)}
.cf-land .cta svg{width:17px;height:17px;stroke:var(--lbrass2);fill:none;stroke-width:2}
.cf-land .meta{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-size:13.5px;color:var(--li2)}
.cf-land .meta span{display:inline-flex;align-items:center;gap:7px}
.cf-land .meta svg{width:14px;height:14px;stroke:var(--lem);fill:none;stroke-width:2}
.cf-land .asm{margin-top:36px;background:var(--lnavy);border-radius:24px 24px 0 0;padding:22px 16px 28px;text-align:left;position:relative;overflow:hidden}
.cf-land .asmh{display:flex;align-items:center;justify-content:space-between}
.cf-land .asmh .t{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8DA0BE}
.cf-land .asmh .dt{display:flex;gap:5px}.cf-land .asmh .dt i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)}
.cf-land .fwrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-bottom:4px}
.cf-land .fwrow::-webkit-scrollbar{display:none}
.cf-land .fw{flex:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#C6D0DE;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.cf-land .fw.on{background:var(--lbrass2);border-color:var(--lbrass2);color:var(--lnavy)}
.cf-land .panel{margin-top:18px;background:var(--lp2);border-radius:16px;padding:20px 18px;position:relative;box-shadow:0 18px 40px rgba(9,16,30,.4)}
.cf-land .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--lline);padding-bottom:14px}
.cf-land .std{font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1.1;color:var(--li)}
.cf-land .ptag{font-size:13px;color:var(--li2);margin-top:3px}
.cf-land .cov{text-align:right;flex:none}
.cf-land .cov b{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:var(--lnavy);display:block;line-height:1}
.cf-land .cov span{font-size:11px;color:var(--li3);font-family:'IBM Plex Mono',monospace}
.cf-land .dl{margin-top:14px;display:grid;gap:8px}
.cf-land .dr{display:flex;align-items:center;gap:11px;font-size:14px;animation:cflfade .4s ease both}
.cf-land .dr .ck{width:19px;height:19px;flex:none;border-radius:50%;background:var(--lems);display:grid;place-items:center}
.cf-land .dr .ck svg{width:11px;height:11px;stroke:var(--lem);fill:none;stroke-width:2.4}
.cf-land .dr .nm{color:var(--li);font-weight:500}
.cf-land .dr .id{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--li3);background:var(--lp);border:1px solid var(--lline);padding:2px 7px;border-radius:6px;flex:none}
.cf-land .stw{position:absolute;top:14px;right:14px;pointer-events:none}
.cf-land .stamp{width:72px;height:72px;animation:cflstamp .5s cubic-bezier(.2,.9,.3,1.2) both}
.cf-land .pf{margin-top:16px;border-top:1px dashed var(--lline2);padding-top:12px;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--li2)}
.cf-land .pf b{color:var(--lnavy);font-weight:600}
.cf-land .rails{background:var(--lnavy);padding:22px 0 30px;overflow:hidden}

.cf-land .rail{display:flex;gap:9px;width:max-content;animation:cflmarq 42s linear infinite}
.cf-land .rc{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 15px;font-size:14px;font-weight:500;white-space:nowrap;color:#DCE3EC}

.cf-land .rc .vk{width:16px;height:16px;border-radius:50%;background:rgba(47,163,126,.18);display:grid;place-items:center}
.cf-land .rc .vk svg{width:9px;height:9px;stroke:var(--lem2);fill:none;stroke-width:2.6}
.cf-land .sc{padding:56px 20px 0;text-align:center}
.cf-land .eb{display:inline-flex;gap:9px;font-size:13.5px;color:var(--li2);margin-bottom:15px;font-family:'IBM Plex Mono',monospace}
.cf-land .eb .n{color:var(--lbrass)}
.cf-land h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(29px,7.3vw,38px);line-height:1.09;letter-spacing:-.018em;color:var(--li)}
.cf-land h2 em{font-style:italic;color:var(--lbrass)}
.cf-land .lede{color:var(--li2);font-size:16px;line-height:1.65;margin:18px auto 0;max-width:38ch}
.cf-land .step{background:var(--lp2);border:1px solid var(--lline);border-radius:22px;padding:24px 22px;margin-top:20px;text-align:left}
.cf-land .step .k{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--lbrass);font-weight:600;letter-spacing:.06em}
.cf-land .step h3{font-family:'Fraunces',serif;font-weight:500;font-size:23px;line-height:1.2;margin-top:9px;color:var(--li)}
.cf-land .step p{color:var(--li2);font-size:15px;line-height:1.6;margin-top:9px}
.cf-land .cm{margin-top:15px;background:var(--lp);border:1px solid var(--lline);border-radius:14px;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7;color:var(--li2)}
.cf-land .cm .hlt{background:var(--lbrasss);color:var(--lbrass);border-radius:4px;padding:0 4px}
.cf-land .split{margin-top:22px;display:grid;gap:12px;text-align:left}
.cf-land .col{border-radius:20px;padding:22px 20px;border:1px solid var(--lline)}
.cf-land .col.does{background:var(--lems);border-color:#CBE6D9}
.cf-land .col.dont{background:var(--lp2)}
.cf-land .col .chh{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.cf-land .col ul{list-style:none;margin-top:14px;display:grid;gap:11px;padding:0}
.cf-land .col li{display:flex;gap:11px;font-size:14.5px;line-height:1.5;color:var(--li)}

.cf-land .plan.feat{border-color:var(--lbrassl);box-shadow:0 12px 34px rgba(180,132,43,.13)}
.cf-land .plan .bdg{position:absolute;top:-11px;left:20px;background:var(--lbrass2);color:var(--lnavy);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:999px}

.cf-land .plan .pp span{font-family:'IBM Plex Sans';font-size:15px;font-weight:500;color:var(--li3)}
.cf-land .plan .pd{font-size:14px;color:var(--li2);margin-top:6px;line-height:1.5}

.cf-land .final .fine{margin-top:16px;font-size:12.5px;color:#7E8CA0;font-family:'IBM Plex Mono',monospace}

.cf-land footer .cp{margin-top:18px;font-size:12px;color:var(--li3);font-family:'IBM Plex Mono',monospace}
